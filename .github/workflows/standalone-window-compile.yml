name: Standalone window compile
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ui/StandaloneAudioSettings.*'
      - 'src/ui/WebPluginEditor.cpp'
      - 'src/bridge/WebViewHolder.cpp'
      - 'web/src/chrome/StandaloneWindowChrome.tsx'
      - '.github/workflows/standalone-window-compile.yml'
permissions:
  contents: read
jobs:
  linux-standalone:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev
      - name: Configure Standalone (Debug avoids release LTO)
        run: cmake -S . -B build-standalone -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Compile real JUCE Standalone wrapper, window chrome and WebView bridge
        run: cmake --build build-standalone --target NeuroKore_Standalone --parallel 2
