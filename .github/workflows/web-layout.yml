name: Web layout
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/**"
      - "docs/agents/ui-ux.md"
      - ".github/workflows/web-layout.yml"
permissions:
  contents: read
jobs:
  layout:
    # Explicitly keep PR #328 manual-only to avoid rebuilding on each
    # small DSP fix. All other PRs keep the established checks.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number != 328 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Serial signal-flow contracts
        working-directory: web
        env:
          NK_LAYOUT_EVIDENCE: ../artifacts/circuit-metrics
        run: npx vitest run src/assemble/layout/serialComposition.test.ts src/assemble/layout/factorySignalFlow.test.ts
      - name: Circuit navigation and signal contracts
        working-directory: web
        run: npx vitest run src/assemble/boardNavigation.test.ts src/assemble/cableSignal.test.ts src/assemble/cablePaint.test.ts src/assemble/layout/pcbComposition.test.ts src/assemble/boardCamera.test.ts src/theme/versionLock.test.ts
      - name: MSEG editor geometry contracts
        working-directory: web
        run: npx vitest run src/assemble/msegModel.test.ts
      - name: Settings regression contracts
        working-directory: web
        run: npx vitest run src/overlays/settingsBody.test.ts src/store/hostStore.test.ts src/chrome/persistUi.test.ts src/assemble/connectModel.test.ts src/assemble/cableMotion.test.ts src/assemble/cableSignal.test.ts
      - name: Preset pack builder contracts
        working-directory: web
        run: npx vitest run src/overlays/packBuilderModel.test.ts
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-layout-evidence
          path: artifacts/circuit-metrics/
          retention-days: 14
          if-no-files-found: warn
