name: Web layout
on:
  pull_request:
    paths:
      - "web/**"
      - "docs/agents/ui-ux.md"
      - ".github/workflows/web-layout.yml"
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Serial signal-flow contracts
        working-directory: web
        env:
          NK_LAYOUT_EVIDENCE: ../artifacts/circuit-metrics
        run: npx vitest run src/assemble/layout/serialComposition.test.ts src/assemble/layout/factorySignalFlow.test.ts
      - name: Circuit navigation and signal contracts
        working-directory: web
        run: npx vitest run src/assemble/boardNavigation.test.ts src/assemble/cableSignal.test.ts src/assemble/cablePaint.test.ts src/assemble/layout/pcbComposition.test.ts src/assemble/boardCamera.test.ts src/theme/versionLock.test.ts
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-layout-evidence
          path: artifacts/circuit-metrics/
          retention-days: 14
          if-no-files-found: warn
