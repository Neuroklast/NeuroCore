name: Web layout
on:
  pull_request:
    paths:
      - "web/**"
      - "docs/agents/ui-ux.md"
      - ".github/workflows/web-layout.yml"
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Playwright browser
        working-directory: web
        run: npx playwright install chromium --with-deps
      - name: Build
        working-directory: web
        run: npm run build
      - name: Serial signal-flow contracts
        working-directory: web
        env:
          NK_LAYOUT_EVIDENCE: ../artifacts/circuit-metrics
        run: npx vitest run src/assemble/layout/serialComposition.test.ts src/assemble/layout/factorySignalFlow.test.ts
      - name: Layout contracts
        working-directory: web
        run: npm run test:layout
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-layout-evidence
          path: |
            web/test-results/
            artifacts/circuit-metrics/
          retention-days: 14
