name: Build

on:
  push:
    # Trigger on pushes to the master branch
    branches: [master]
  pull_request:
    # Run CI on all pull requests

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            pkg-config

      # FetchContent pulls JUCE 8.0.6 and applies the juceaide helper-tool fix in CMakeLists.txt
      - name: Configure
        shell: bash
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_HELPER_TOOLS=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release 2>&1 | tee build-${{ matrix.os }}.log

      - name: Build tests
        shell: bash
        run: cmake --build build --target NeuroCoreTests --config Release

      - name: Run tests
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: Download pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip -o pluginval.zip
          unzip -o pluginval.zip

      - name: Download pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip -o pluginval.zip
          unzip -o pluginval.zip

      - name: Download pluginval (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -o pluginval.zip
          unzip -o pluginval.zip

      - name: Validate VST3 (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ./pluginval
          ./pluginval --validate-in-process --strictness-level 5 "build/NeuroCore_artefacts/Release/VST3/NeuroCore.vst3"

      - name: Validate VST3 (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x ./pluginval.app/Contents/MacOS/pluginval
          ./pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 "build/NeuroCore_artefacts/Release/VST3/NeuroCore.vst3"

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./pluginval.exe --validate-in-process --strictness-level 5 "build/NeuroCore_artefacts/Release/VST3/NeuroCore.vst3"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build-${{ matrix.os }}.log

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: NeuroCore-${{ matrix.os }}
          path: build/NeuroCore_artefacts
