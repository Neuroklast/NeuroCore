name: Build

on:
  push:
    # Trigger on pushes to the master branch
    branches: [master]
  pull_request:
    # Run CI on all pull requests
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux/macOS skipped for now (juceaide/GTK packaging issues on GHA)
        os: [windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libasound2-dev \
            libcurl4-openssl-dev \
            pkg-config

      # FetchContent pulls JUCE 8.0.6 and applies the juceaide helper-tool fix in CMakeLists.txt
      - name: Configure
        shell: bash
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_HELPER_TOOLS=ON

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release 2>&1 | tee build-${{ matrix.os }}.log

      - name: Build tests
        shell: bash
        run: cmake --build build --target NeuroCoreTests --config Release

      - name: Run tests
        shell: bash
        # Multi-config (VS) needs -C; single-config (Ninja/Make) ignores it
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download pluginval (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip -o pluginval.zip
          unzip -o pluginval.zip

      - name: Download pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip -o pluginval.zip
          unzip -o pluginval.zip

      - name: Download pluginval (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -o pluginval.zip
          unzip -o pluginval.zip

      - name: Validate VST3 (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x ./pluginval
          ./pluginval --validate-in-process --strictness-level 5 "build/NeuroCore_artefacts/Release/VST3/NeuroCore.vst3"

      - name: Validate VST3 (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x ./pluginval.app/Contents/MacOS/pluginval
          ./pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 "build/NeuroCore_artefacts/Release/VST3/NeuroCore.vst3"

      - name: Validate VST3 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./pluginval.exe --validate-in-process --strictness-level 5 "build/NeuroCore_artefacts/Release/VST3/NeuroCore.vst3"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build-${{ matrix.os }}.log

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: NeuroCore-${{ matrix.os }}
          path: build/NeuroCore_artefacts

  # Audio Units are Apple-only. This job is how we ship NeuroCore.component
  # without a local Mac. Windows remains the unit-test gate.
  au:
    name: AU (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build AU
        run: cmake --build build --config Release --target NeuroCore_AU --parallel

      - name: Locate, sign, and install AU
        id: au
        run: |
          set -euo pipefail
          AU=""
          for candidate in \
            build/NeuroCore_artefacts/Release/AU/NeuroCore.component \
            build/NeuroCore_artefacts/AU/NeuroCore.component
          do
            if [ -d "$candidate" ]; then
              AU="$candidate"
              break
            fi
          done
          if [ -z "$AU" ]; then
            echo "NeuroCore.component not found under build/NeuroCore_artefacts"
            ls -laR build/NeuroCore_artefacts || true
            exit 1
          fi
          echo "Found $AU"
          codesign --force --deep --sign - "$AU"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/NeuroCore.component"
          cp -R "$AU" "$HOME/Library/Audio/Plug-Ins/Components/NeuroCore.component"
          codesign --force --deep --sign - "$HOME/Library/Audio/Plug-Ins/Components/NeuroCore.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          echo "bundle=$AU" >> "$GITHUB_OUTPUT"

      - name: Validate AU with auval
        timeout-minutes: 10
        run: |
          auval -a | grep -i -e NeuroCore -e NRCO || true
          auval -v aumf NRCO NRKL

      - name: Download pluginval (macOS)
        run: |
          curl -fsSL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip -o pluginval.zip
          unzip -o pluginval.zip

      - name: Validate AU with pluginval
        timeout-minutes: 15
        run: |
          chmod +x ./pluginval.app/Contents/MacOS/pluginval
          ./pluginval.app/Contents/MacOS/pluginval --validate-in-process --strictness-level 5 \
            "$HOME/Library/Audio/Plug-Ins/Components/NeuroCore.component"

      - name: Upload AU
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: NeuroCore-AU-macOS
          path: |
            build/NeuroCore_artefacts/Release/AU/
            build/NeuroCore_artefacts/AU/
          if-no-files-found: warn
          retention-days: 30
