# .github/workflows/msbuild.yml
name: MSBuild

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Path to your JUCE-generated Visual Studio solution (relative to repo root)
  SOLUTION_FILE_PATH: NeuroCore.sln
  # Build configuration: Debug or Release
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build solution
        run: msbuild "${{ env.SOLUTION_FILE_PATH }}" /m /p:Configuration=${{ env.BUILD_CONFIGURATION }}

      - name: Run CTest (optional)
        if: always()
        run: |
          pushd build
          ctest --output-on-failure --config ${{ env.BUILD_CONFIGURATION }}
          popd
