name: Native alpha builds
on:
  push:
    branches: [optimize/fx-runtime-factory]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-alpha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          - os: macos-14
            platform: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev xvfb
      - name: Windows browser SDK
        if: runner.os == 'Windows'
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory deps
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/deps"
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Source contracts
        run: |
          python tests/test_realtime_source.py
          python tests/test_release_layout.py
      - name: Build plug-ins and full native test suite
        run: |
          cmake --build build --config Release --target NeuroKoreWebEmbed --parallel 3
          cmake --build build --config Release --target NeuroKore_All --parallel 3
          cmake --build build --config Release --target NeuroKoreTests --parallel 3
      - name: Full native suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ctest --test-dir build -C Release --output-on-failure --timeout 900
      - name: Full native suite (Windows and macOS)
        if: runner.os != 'Linux'
        run: ctest --test-dir build -C Release --output-on-failure --timeout 900
      - name: Web suite
        working-directory: web
        run: npm test
      - name: Package native artifacts and licenses
        run: python scripts/package_alpha.py --build build --platform ${{ matrix.platform }} --commit ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: NEUROKORE-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.platform }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
  release:
    if: contains(github.event.head_commit.message, '[release-alpha]')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NEUROKORE-*
          path: release
          merge-multiple: true
      - name: Publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="alpha-tested-${GITHUB_SHA:0:12}"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title "NEUROKORE 0.6.4-beta — alpha test build" --notes-file docs/ALPHA_RELEASE_NOTES.md
