<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
<title id="title">NEUROKORE Black Gunmetal Containment Ring</title>
<desc id="desc">Transparent vector overlay matching the slim four-clamp ring of the NEUROKORE UNIT interface. No lights or emissive effects; those are rendered in software.</desc>
<defs>
  <!-- Neutral-metal gradients; no baked light emission. -->
  <linearGradient id="railMetal" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#0E1218"/>
    <stop offset=".19" stop-color="#525B66"/>
    <stop offset=".32" stop-color="#1D242C"/>
    <stop offset=".55" stop-color="#10151B"/>
    <stop offset=".73" stop-color="#343E48"/>
    <stop offset="1" stop-color="#090C10"/>
  </linearGradient>
  <linearGradient id="steelEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#727B83"/>
    <stop offset=".19" stop-color="#343D47"/>
    <stop offset=".40" stop-color="#0B1015"/>
    <stop offset=".60" stop-color="#242D36"/>
    <stop offset=".86" stop-color="#151A20"/>
    <stop offset="1" stop-color="#4F5963"/>
  </linearGradient>
  <linearGradient id="clampSurface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#55616A"/>
    <stop offset=".14" stop-color="#252C34"/>
    <stop offset=".39" stop-color="#0B0F14"/>
    <stop offset=".58" stop-color="#2E3741"/>
    <stop offset=".83" stop-color="#11161C"/>
    <stop offset="1" stop-color="#414A53"/>
  </linearGradient>
  <linearGradient id="machinedPlate" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#59636D"/>
    <stop offset=".09" stop-color="#343E49"/>
    <stop offset=".3" stop-color="#0B1015"/>
    <stop offset=".55" stop-color="#19212A"/>
    <stop offset=".72" stop-color="#3E4954"/>
    <stop offset="1" stop-color="#10151B"/>
  </linearGradient>
  <linearGradient id="hubBase" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6E7780"/>
    <stop offset=".11" stop-color="#28323C"/>
    <stop offset=".34" stop-color="#151D25"/>
    <stop offset=".7" stop-color="#0A1016"/>
    <stop offset=".88" stop-color="#3C4650"/>
    <stop offset="1" stop-color="#747D85"/>
  </linearGradient>
  <radialGradient id="hubInset" cx=".31" cy=".28" r=".83">
    <stop offset="0" stop-color="#56616D"/>
    <stop offset=".19" stop-color="#222B34"/>
    <stop offset=".63" stop-color="#10161C"/>
    <stop offset=".9" stop-color="#080B0F"/>
    <stop offset="1" stop-color="#4A535C"/>
  </radialGradient>
  <filter id="housingShadow" x="-.25" y="-.25" width="1.5" height="1.5" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".34"/>
  </filter>
  <!-- Local assembly: cardinal axis points outwards (negative Y); hub is inward of the ring. -->
  <g id="clampMaster">
    <!-- Dark housing plate anchors across the ring, intentionally compact. -->
    <path d="M-35 -465 H35 L39 -457 V-435 L31 -427 H-31 L-39 -435 V-457 Z" fill="url(#clampSurface)" stroke="#667079" stroke-opacity=".48" stroke-width="1.2"/>
    <path d="M-29 -460 H29 V-449 H-29 Z" fill="#06090C" opacity=".7"/>
    <path d="M-25 -461 H25" stroke="#B1BCC5" stroke-opacity=".28" stroke-width="1.5"/>
    <path d="M-33 -435 H33" stroke="#9CA6AF" stroke-opacity=".16" stroke-width="1.2"/>
    <!-- Two vertical tension brackets extending towards inner particle ring. -->
    <path d="M-28 -441 L-23 -407 L-12 -393 L-12 -415 L-17 -437Z" fill="url(#machinedPlate)" stroke="#737D86" stroke-opacity=".4" stroke-width="1.2"/>
    <path d="M28 -441 L23 -407 L12 -393 L12 -415 L17 -437Z" fill="url(#machinedPlate)" stroke="#737D86" stroke-opacity=".4" stroke-width="1.2"/>
    <path d="M-20 -437 L-17 -417 M20 -437 L17 -417" stroke="#A8B2BB" stroke-opacity=".3" stroke-width="1.4"/>
    <!-- Dark mounting collar, NO LED, NO glow. -->
    <rect x="-30" y="-420" width="60" height="24" rx="3" fill="url(#clampSurface)" stroke="#7C8791" stroke-opacity=".48"/>
    <path d="M-29 -418 H29" stroke="#BCC3CA" stroke-opacity=".3" stroke-width="1.5"/>
    <path d="M-29 -399 H29" stroke="#080B0F" stroke-width="2"/>
    <circle cx="0" cy="-405" r="21" fill="url(#hubBase)" stroke="#8D98A2" stroke-opacity=".48" stroke-width="2.2"/>
    <circle cx="0" cy="-405" r="16" fill="#121A22" stroke="#05080A" stroke-width="3"/>
    <circle cx="0" cy="-405" r="11" fill="url(#hubInset)" stroke="#7B848D" stroke-opacity=".23" stroke-width="1"/>
    <!-- A recessed dark spindle rather than a painted lamp. -->
    <circle cx="0" cy="-405" r="5.5" fill="#090D11" stroke="#444E57" stroke-width="1.4"/>
    <circle cx="0" cy="-405" r="2" fill="#2D353D"/>
    <!-- Machine fasteners, neutral metal. -->
    <circle cx="-29" cy="-445" r="3.2" fill="#06090D" stroke="#69727C" stroke-width=".9"/>
    <circle cx="29" cy="-445" r="3.2" fill="#06090D" stroke="#69727C" stroke-width=".9"/>
    <path d="M-30 -445 H-28 M28 -445 H30" stroke="#828B95" stroke-opacity=".65" stroke-width=".8"/>
  </g>
  <!-- Compact intermediate pressure brackets, not floating fragments. -->
  <g id="minorBracket">
    <path d="M-13 -459 L13 -459 L14 -432 L8 -427 L-8 -427 L-14 -432Z" fill="url(#clampSurface)" stroke="#525B64" stroke-opacity=".55" stroke-width="1"/>
    <path d="M-10 -457 H10 V-453 H-10 Z" fill="#838D96" opacity=".18"/>
    <path d="M-8 -441 H8" stroke="#080C10" stroke-width="2"/>
    <circle cx="0" cy="-446" r="2.4" fill="#0B1016" stroke="#747C84" stroke-opacity=".55" stroke-width=".8"/>
  </g>
</defs>

<g transform="translate(512 512)">
  <!-- Anodized black tracks: only the physically thin ring, no filled disc. -->
  <g id="ring-rails">
    <circle r="456" stroke="#0A0E13" stroke-width="5" opacity=".94"/>
    <circle r="453.3" stroke="url(#railMetal)" stroke-width="2.8" opacity=".87"/>
    <circle r="449.6" stroke="#818B95" stroke-width=".9" opacity=".41"/>
    <circle r="444.5" stroke="#111820" stroke-width="5.4" opacity=".93"/>
    <circle r="441.1" stroke="url(#steelEdge)" stroke-width="2.5" opacity=".8"/>
    <circle r="437" stroke="#030508" stroke-width="3" opacity=".72"/>
    <circle r="430" stroke="#1A232C" stroke-width="6.2" opacity=".95"/>
    <circle r="428.3" stroke="#89939D" stroke-width="1" opacity=".36"/>
    <circle r="424" stroke="#06090D" stroke-width="2.4" opacity=".86"/>
    <circle r="420" stroke="#69747F" stroke-width="1.1" opacity=".29"/>
    <circle r="416" stroke="#111920" stroke-width="3.1" opacity=".69"/>
    <circle r="412.2" stroke="#67717A" stroke-width="1" opacity=".24"/>
  </g>
  <!-- segmented machined outer panels, with small physical gaps -->
  <g id="radial-segments" stroke-linecap="butt">

