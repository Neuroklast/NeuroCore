<use xlink:href="#minorBracket" transform="rotate(30)"/>
<use xlink:href="#minorBracket" transform="rotate(60)"/>
<use xlink:href="#minorBracket" transform="rotate(120)"/>
<use xlink:href="#minorBracket" transform="rotate(150)"/>
<use xlink:href="#minorBracket" transform="rotate(210)"/>
