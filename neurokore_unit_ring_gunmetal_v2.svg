  <g id="cardinal-clamps" filter="url(#housingShadow)">
    <use xlink:href="#clampMaster" transform="rotate(0)"/>
    <use xlink:href="#clampMaster" transform="rotate(90)"/>
    <use xlink:href="#clampMaster" transform="rotate(180)"/>
    <use xlink:href="#clampMaster" transform="rotate(270)"/>
  </g>
</g>
