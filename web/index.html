<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEUROKORE</title>
    <style>
      html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
      #nk-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #000;
      }
      #nk-splash .nk-splash-mark {
        display: flex; flex-direction: column; align-items: center; gap: 18px;
      }
      #nk-splash img { height: 88px; width: auto; }
      .nk-splash-track {
        width: 160px; height: 3px; background: #222;
      }
      #nk-splash-bar {
        height: 100%; width: 12%; background: #ff2222;
      }
      html[data-nk-ready] #nk-splash { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="nk-splash" aria-hidden="true">
      <div class="nk-splash-mark">
        <img src="./img/nk_logo.png" alt="NEUROKLAST" />
        <div class="nk-splash-track">
          <div id="nk-splash-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="12"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
